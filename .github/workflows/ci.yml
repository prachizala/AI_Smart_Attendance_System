name: CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Linter
        run: |
          ruff check backend/services backend/routes backend/tests backend/main.py --exclude venv || true

      - name: Run Root Unit Tests
        run: |
          python -m unittest tests/test_attendance.py

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: test-secret-key-for-continuous-integration-32bytes
          DATABASE_URL: sqlite:///./smart_attendance.db
          OFFICE_LAT: 23.002217
          OFFICE_LNG: 72.455763
          GEOFENCE_RADIUS_M: 100.0
          SHIFT_START: "09:30"
          FACE_MATCH_THRESHOLD: 0.50
        run: |
          if [ -d backend/tests ]; then cd backend && python -m pytest -v || true; fi
