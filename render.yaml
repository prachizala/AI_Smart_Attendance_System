services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: smart-attendance-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        generateValue: false

  # 2. React Admin Dashboard Static Site
  - type: web
    name: smart-attendance-admin
    env: static
    rootDir: admin-dashboard
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-attendance-backend
          property: host
