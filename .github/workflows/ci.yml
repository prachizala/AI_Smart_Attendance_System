name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/services backend/routes backend/tests backend/main.py --exclude venv

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: test-secret-key-for-continuous-integration-32bytes
          DATABASE_URL: sqlite:///./smart_attendance.db
          OFFICE_LAT: 23.002217
          OFFICE_LNG: 72.455763
          GEOFENCE_RADIUS_M: 100.0
          SHIFT_START: "09:30"
          FACE_MATCH_THRESHOLD: 0.50
        run: |
          cd backend
          set -o pipefail
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.log

      - name: Write Step Summary
        if: always()
        run: |
          echo "START_PYTEST_LOG" >> $GITHUB_STEP_SUMMARY
          tail -n 80 backend/pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo "END_PYTEST_LOG" >> $GITHUB_STEP_SUMMARY

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest_output.log
