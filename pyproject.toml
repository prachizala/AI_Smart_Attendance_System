[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "node_modules",
    "dist",
    "build",
    ".expo"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | __pycache__
  | venv
  | \.venv
  | node_modules
  | dist
  | build
  | \.expo
)/
'''
